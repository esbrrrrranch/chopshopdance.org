<a class="skip-link" href="#main"> Skip to content </a>
<header class="site-header">
  <a class="brand" href="/">
    <img
      alt="CHOP SHOP: Bodies of Work"
      height="420"
      src="/assets/images/chop-shop-logo.png"
      width="1336"
    />
  </a>
  <button
    aria-controls="main-navigation"
    aria-expanded="false"
    aria-label="Open navigation"
    class="menu-toggle"
    type="button"
  >
    <span aria-hidden="true" class="menu-icon"></span>
  </button>
  <nav class="site-nav" aria-label="Main navigation" id="main-navigation">
    <a
      aria-current="{% if page.url == '/' %}page{% else %}false{% endif %}"
      href="/"
    >
      Home
    </a>
    <details class="nav-group">
      <summary
        class="{% if page.url == '/sponsors-press/' or page.url == '/support/' or page.url == '/history/' or page.url == '/staff/' %}active{% endif %}"
      >
        About Us
      </summary>
      <div class="submenu">
        <a
          aria-current="{% if page.url == '/history/' %}page{% else %}false{% endif %}"
          href="/history/"
        >
          The First Fourteen Years
        </a>
        <a
          aria-current="{% if page.url == '/staff/' %}page{% else %}false{% endif %}"
          href="/staff/"
        >
          Staff
        </a>
        <a
          aria-current="{% if page.url == '/sponsors-press/' %}page{% else %}false{% endif %}"
          href="/sponsors-press/"
        >
          Sponsors + Press
        </a>
        <a
          aria-current="{% if page.url == '/support/' %}page{% else %}false{% endif %}"
          href="/support/"
        >
          Support
        </a>
      </div>
    </details>
    <details class="nav-group">
      <summary
        class="{% if page.url == '/apply/' or page.url == '/festival-artists/' or page.url == '/experience-dance-program/' %}active{% endif %}"
      >
        The Festival
      </summary>
      <div class="submenu">
        <a
          aria-current="{% if page.url == '/festival-artists/' %}page{% else %}false{% endif %}"
          href="/festival-artists/"
        >
          Festival Artists
        </a>
        <a
          aria-current="{% if page.url == '/experience-dance-program/' %}page{% else %}false{% endif %}"
          href="/experience-dance-program/"
        >
          Experience Dance Program
        </a>
        <a
          aria-current="{% if page.url == '/apply/' %}page{% else %}false{% endif %}"
          href="/apply/"
        >
          Apply
        </a>
      </div>
    </details>
    <a
      aria-current="{% if page.url == '/contact/' %}page{% else %}false{% endif %}"
      href="/contact/"
    >
      Contact
    </a>
  </nav>
</header>
